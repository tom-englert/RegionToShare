name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  PRODUCT_NAME: RegionToShare

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set build version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "src\Directory.Build.props"
          $propertyGroup = $props.Project.PropertyGroup | Select-Object -First 1
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER % [uint16]::MaxValue
          [Version]$current = $propertyGroup.Version
          $version = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $current } else { [Version]::new($current.Major, $current.Minor, $buildNumber) }
          "VERSION=$version" >> $env:GITHUB_ENV
          [xml]$manifest = Get-Content ".\src\RegionToShare\Package.appxmanifest"
          $manifest.Package.Identity.Version = ([Version]::new($version.Major, $version.Minor, $version.Build, 0)).ToString()
          $manifest.Save((Resolve-Path ".\src\RegionToShare\Package.appxmanifest"))

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $appx = "$env:RUNNER_TEMP\AppxPackages"
          $args = @("publish", "src\RegionToShare\RegionToShare.csproj", "-c", $env:BUILD_CONFIGURATION,
            "-p:GenerateAppxPackageOnBuild=true", "-p:AppxPackageDir=$appx\")
          if ($env:VERSION) { $args += "-p:Version=$env:VERSION" }
          dotnet @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APPX_DIR=$appx" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_NAME }}
          path: src/RegionToShare/bin/${{ env.BUILD_CONFIGURATION }}/net10.0-windows10.0.19041.0/win-x64/publish/RegionToShare.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: ${{ env.APPX_DIR }}
          if-no-files-found: warn
