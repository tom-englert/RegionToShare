name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  PRODUCT_NAME: RegionToShare

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set build version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "src\Directory.Build.props"
          $version = [Version]($props.Project.PropertyGroup | Select-Object -First 1).Version
          [xml]$manifest = Get-Content ".\src\RegionToShare\Package.appxmanifest"
          $manifest.Package.Identity.Version = ([Version]::new($version.Major, $version.Minor, $version.Build, 0)).ToString()
          $manifest.Save((Resolve-Path ".\src\RegionToShare\Package.appxmanifest"))

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish executables
        shell: pwsh
        run: |
          foreach ($rid in @("win-x64", "win-arm64")) {
            dotnet publish src\RegionToShare\RegionToShare.csproj -c $env:BUILD_CONFIGURATION -r $rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build MSIX bundle
        shell: pwsh
        run: |
          $appx = "$env:RUNNER_TEMP\AppxPackages"
          $platforms = "x64|arm64"
          $args = @("src\RegionToShare\RegionToShare.csproj", "-restore", "-p:Configuration=$env:BUILD_CONFIGURATION", "-p:GenerateAppxPackageOnBuild=true", "-p:AppxBundle=Always", "-p:AppxBundlePlatforms=$platforms", "-p:AppxPackageDir=$appx\")
          msbuild @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APPX_DIR=$appx" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_NAME }}-x64
          path: src/RegionToShare/bin/${{ env.BUILD_CONFIGURATION }}/net10.0-windows10.0.19041.0/win-x64/publish/RegionToShare.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_NAME }}-arm64
          path: src/RegionToShare/bin/${{ env.BUILD_CONFIGURATION }}/net10.0-windows10.0.19041.0/win-arm64/publish/RegionToShare.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Bundle
          path: ${{ env.APPX_DIR }}/**/*.msixbundle
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches version and extract release notes
        shell: pwsh
        run: |
          [xml]$props = Get-Content "src/Directory.Build.props"
          $version = [Version]($props.Project.PropertyGroup | Select-Object -First 1).Version
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $short = "$($version.Major).$($version.Minor)"
          if ($tag -ne $short -and $tag -ne $version.ToString()) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not match version '$version'"
            exit 1
          }
          $notes = @()
          $found = $false
          foreach ($line in Get-Content ReleaseNotes.md) {
            if ($line.Trim() -match '^\d+(\.\d+)*$') {
              if ($found) { break }
              if ($line.Trim() -eq $short -or $line.Trim() -eq $version.ToString()) { $found = $true }
              continue
            }
            if ($found) { $notes += $line }
          }
          ($notes -join "`n").Trim() | Set-Content release-notes.txt

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.txt
          files: artifacts/**
