pool:
  vmImage: 'windows-2022'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  productName: 'RegionToShare'
  appxPackageDir: '$(build.artifactStagingDirectory)\AppxPackages'

steps:
- task: PowerShell@1
  displayName: 'Set build version'
  inputs:
    scriptType: inlineScript
    inlineScript: |
        [xml]$props = Get-Content "src\Directory.Build.props"
        $propertyGroup = $props.Project.PropertyGroup | Select-Object -First 1
        $buildNumber = [int]$env:BUILD_BUILDID % [uint16]::MaxValue
        [Version]$current = $propertyGroup.Version
        $version = [Version]::new($current.Major, $current.Minor, $buildNumber)
        Write-Host "##vso[task.setvariable variable=version]$version"
        Write-Host "##vso[build.updatebuildnumber]$($env:BUILD_BUILDNUMBER)-$version"
        [xml]$manifest= get-content ".\src\Packaging\Package.appxmanifest"
        $manifest.Package.Identity.Version = ([Version]::new($version.Major, $version.Minor, $version.Build, 0)).ToString()
        $manifest.save((Resolve-Path ".\src\Packaging\Package.appxmanifest"))

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: /p:AppxPackageDir="$(appxPackageDir)" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false /p:Version=$(version)

- task: CopyFiles@2
  inputs:
    Contents: 'src/RegionToShare/bin/$(buildConfiguration)/net462/*.*'
    TargetFolder: '$(build.artifactstagingdirectory)/bin'
    flattenFolders: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/bin'
    ArtifactName: '$(productName)'
    publishLocation: 'Container'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(appxPackageDir)'
    ArtifactName: 'Package'
    publishLocation: 'Container'

